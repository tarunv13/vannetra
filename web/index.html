<!-- data-clarity: the Microsoft Clarity project id. Remove the attribute (or set it to
     REPLACE_ME) and no analytics load at all — useful for forks and local work. -->
<body data-clarity="ymgmjfjuz4">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2" opacity=".28"/>
      <path d="M7.2 21.6C10.6 12.2 17.2 9.2 24.8 11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray=".1 4.2"/>
      <circle cx="7.2" cy="21.6" r="3.3" fill="currentColor"/>
      <circle cx="24.8" cy="11" r="3.8" fill="#c27a06"/>
    </symbol>
  </svg>

  <div class="boot" id="boot" aria-hidden="true"><svg><use href="#logo"/></svg></div>
  <div id="globe" role="region" aria-label="The Atlas: world map of wildlife-trade evidence"></div>

  <header class="topbar">
    <a class="brand glass" href="#" id="home" aria-label="WildTrace: reset the map">
      <svg><use href="#logo"/></svg>
      <span><b><span class="wm-a">Wild</span>Trace</b><small>The open atlas of illegal wildlife trade</small></span>
    </a>
    <div class="omni" id="omni">
      <div class="omni-box glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" data-clarity-mask="true" autocomplete="off" placeholder="Search cases, species, places, observatories…" aria-label="Search everything" aria-controls="omni-results">
        <span class="kbd" aria-hidden="true">/</span>
      </div>
      <div class="omni-results glass" id="omni-results" role="listbox" aria-label="Search results"></div>
    </div>
    <nav class="lenses glass" aria-label="Atlas layers and tools">
      <div class="modes" role="group" aria-label="What the map shows">
        <button class="mode" data-mode="cases" aria-pressed="true" style="--c:var(--cases-ink)">Cases</button>
        <button class="mode" data-mode="flows" aria-pressed="false" style="--c:var(--trade-ink)">Flows</button>
        <button class="mode" data-mode="zoo" aria-pressed="false" style="--c:#a3245e">Zoonoses</button>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <button class="lens" data-sheet="analysis"><span class="label">Analysis</span></button>
      <button class="lens" data-sheet="table"><span class="label">Table</span></button>
      <button class="lens" data-sheet="network"><span class="label">Network</span></button>
      <button class="lens" data-sheet="methods"><span class="label">Methods</span></button>
      <button class="lens" data-sheet="about"><span class="label">About</span></button>
      <button class="lens guide-btn" id="tour-btn" title="The 2-minute video guide and the guided tours"><span class="label">▶ Guide</span></button>
      <button class="lens tool" data-sheet="investigate"><span class="label">Investigate</span></button>
    </nav>
  </header>

  <aside class="pulse glass" id="pulse" aria-label="Summary and filters">
    <div class="pulse-head">
      <h2>Pulse</h2>
      <button class="icon-btn" id="fold" aria-label="Fold the summary panel" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg></button>
    </div>
    <div class="pulse-body" id="pulse-body">
      <div class="skeleton" style="height:64px"></div><div class="skeleton" style="height:120px;margin-top:10px"></div>
    </div>
  </aside>

  <aside class="inspector glass" id="inspector" aria-label="Details" aria-live="polite">
    <div class="insp-head">
      <button class="icon-btn" id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="icon-btn" id="fwd" aria-label="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="Trail"></nav>
      <button class="icon-btn" id="close" aria-label="Close details"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="insp-body" id="insp-body"></div>
  </aside>

  <aside class="flowside glass" id="flowside" aria-label="Your story and the routes on the map" aria-live="polite"><div class="fs-body" id="fs-body"></div></aside>

  <div class="mapctl">
    <button class="icon-btn" id="proj" aria-label="Switch between globe and flat map" title="Globe / flat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></button>
    <button class="icon-btn" id="sat" aria-pressed="false" aria-label="Satellite view on or off" title="Satellite view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-6 4 4 3-3 6 5"/><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="16" cy="8.5" r="1.6"/></svg></button>
    <button class="icon-btn" id="world" aria-label="Show the whole world" title="Whole world"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="icon-btn" id="legend-toggle" aria-pressed="true" aria-label="Show or hide the legend" title="Legend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="7" r="2"/><circle cx="6" cy="17" r="2"/><path d="M11 7h9M11 17h9"/></svg></button>
  </div>

  <div class="legend glass" aria-label="Legend and map layers">
    <div class="legend-layers" role="group" aria-label="Show on the map">
      <button class="lens" data-layer="cases" aria-pressed="true" style="--c:var(--cases)"><span class="dot"></span><span class="label">Cases</span> <span class="n" id="n-cases"></span></button>
      <button class="lens" id="go-flows" style="--c:var(--trade)" title="Where wildlife is taken and where it is seized, from CITES records"><span class="dot"></span><span class="label">Trade routes: open Flows</span> <span class="n">›</span></button>
      <button class="lens" data-layer="observatories" aria-pressed="false" style="--c:var(--network)"><span class="dot"></span><span class="label">Observatories</span> <span class="n" id="n-obs"></span></button>
      <button class="lens" data-layer="mine" aria-pressed="true" style="--c:var(--invest)" hidden id="lens-mine"><span class="dot"></span><span class="label">Your data</span> <span class="n" id="n-mine"></span></button>
    </div>
    <div class="r"><span class="sw" style="background:var(--k-seizure)"></span>Seizure</div>
    <div class="r"><span class="sw" style="background:var(--k-arrest)"></span>Arrest · conviction</div>
    <div class="r"><span class="sw" style="background:var(--k-other)"></span>Rescue · report</div>
    <div class="r muted"><span class="sw" style="background:var(--k-seizure);opacity:.5"></span>Paler: single report</div>
    <div class="r muted"><span class="sw" style="background:transparent;box-shadow:0 0 0 2px var(--k-seizure)"></span>Ring: approximate place</div>
    <div class="r muted"><span class="sw" style="background:radial-gradient(circle,rgba(214,69,61,.7),rgba(214,69,61,0) 70%);box-shadow:none"></span>Glow: density of reports</div>
    <div class="r muted"><span class="sw" style="background:var(--network);border-radius:3px;transform:rotate(45deg)"></span>Observatory</div>
  </div>

  <section class="dock glass" aria-label="Timeline">
    <button class="play" id="play" aria-label="Glide through the cases in time order"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    <div class="tl" id="tl" role="group" aria-label="Cases per week. Drag across the chart to choose a period."></div>
    <div class="dock-side"><b id="range-label">All time</b><span id="range-sub"></span><button class="btn" id="range-reset" hidden style="height:26px;font-size:12px;padding:0 10px">Clear period</button></div>
  </section>

  <!-- data-clarity-mask: a reader's imported spreadsheet is rendered in here. It never reaches a session replay. -->
  <section class="sheet glass" data-clarity-mask="true" id="sheet" role="dialog" aria-modal="false" aria-labelledby="sheet-title">
    <div style="padding-top:8px"><div class="grab"></div></div>
    <div class="sheet-head">
      <h2 id="sheet-title">Investigate</h2>
      <div class="tabs" id="sheet-tabs" role="tablist"></div>
      <span style="flex:1"></span>
      <button class="icon-btn" id="sheet-close" aria-label="Close panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div id="trivia-root"></div>
  <div class="toast glass" id="toast" role="status"></div>
  <div class="tip glass" id="tip" role="tooltip"></div>
  <noscript><div style="position:fixed;inset:0;overflow:auto;background:#edf1ef;padding:24px 16px;font:16px/1.6 system-ui,sans-serif">
    <h1 style="font-size:1.6rem;margin:0 0 8px">WildTrace — the open atlas of illegal wildlife trade</h1>
    <p>The map needs JavaScript, but the whole record is readable without it:</p>
    <ul><li><a href="browse.html">Browse every species group and country</a></li>
      <li><a href="data/cases.csv">Download all cases as CSV</a> (CC BY 4.0)</li>
      <li><a href="llms.txt">What this dataset is, in plain text</a></li></ul></div></noscript>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script type="module" src="js/main.js?v=1.6.3"></script>
</body>
</html>
