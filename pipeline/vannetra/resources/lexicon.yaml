# Species-group lexicon for illegal wildlife trade (IWT) in South and Southeast Asia.
#
# Each group lists trade/product terms in English, romanised Indian languages
# (as sellers actually type them), native scripts, and Southeast Asian languages.
# Terms taken from the WCS-OWT keyword sets (kwsearch.py) are marked `# owt`.
#
# `cites` is the CITES Appendix as of CoP19 (2022) for the group's main traded taxa.
# It is a convenience label only: verify with Species+ (speciesplus.net) before
# publishing any claim about a specific taxon or population.
#
# Add a group or term with a pull request; tests check that the file parses.

groups:
  pangolin:
    label: Pangolin
    taxa: [Manis crassicaudata, Manis javanica, Manis pentadactyla]
    cites: "I"
    products: [scales, live, meat]
    terms:
      en: [pangolin, pangolins, pangolin scales, pangolin scale, scaly anteater]
      hi_latn: [vajrakit, bajarkit, bajrakapta, bajra kapta, vajrakit chilka, pangolin chilka]  # owt
      hi: [पैंगोलिन, वज्रकीट]
      te_latn: [alugu, alugu chippalu, adavi volgo]  # owt
      te: [అలుగు]
      vi: [tê tê, vảy tê tê]
      id_ms: [trenggiling, sisik trenggiling, tenggiling]
      th: [ตัวนิ่ม, ลิ่น]
  musk_deer:
    label: Musk deer
    taxa: [Moschus spp.]
    cites: "I"
    products: [musk pod]
    terms:
      en: [musk deer, musk pod, musk pods, deer musk]
      hi_latn: [kasturi, asli kasturi, kasturi nabhi, kasturi mrig]  # owt
      hi: [कस्तूरी, कस्तूरी मृग]
      vi: [xạ hương]
  monitor_lizard:
    label: Monitor lizard
    taxa: [Varanus bengalensis, Varanus flavescens, Varanus salvator]
    cites: "I"
    products: ["hemipenis (sold as hatha jodi)", skin, meat]
    terms:
      en: [monitor lizard, monitor lizards, bengal monitor, water monitor]
      hi_latn: [hatha jodi, hattha jodi, hath jodi, ghorpad]  # owt
      hi: [हत्था जोड़ी, हाथा जोड़ी, गोह]
      id_ms: [biawak]
  jackal:
    label: Golden jackal
    taxa: [Canis aureus]
    cites: "III"
    products: ["siyar singhi (horn-like growth, often fake)"]
    terms:
      en: [jackal horn, golden jackal]
      hi_latn: [siyar singhi, siyar singi, gidar singhi]  # owt
      hi: [सियार सिंगी, सियार सींगी]
  sand_boa:
    label: Sand boa
    taxa: [Eryx johnii, Eryx conicus]
    cites: "II"
    products: [live]
    terms:
      en: [red sand boa, sand boa, sand boas, double engine snake, two headed snake, 2 headed snake, rice puller snake]  # owt
      hi_latn: [do muha saap, do muh wala saap, domuha, do munha sanp, dumuhi]  # owt
      hi: [दोमुंहा सांप, दो मुंहा सांप]
  wild_boar:
    label: Wild boar
    taxa: [Sus scrofa]
    cites: null
    products: [tusk]
    terms:
      en: [wild boar tusk, boar tusk]
      hi_latn: [shukar dant, sukar dant, suar dant]  # owt
      hi: [शूकर दंत, सूअर दांत]
  turtles:
    label: Turtles & tortoises
    taxa: [Geochelone elegans, Nilssonia gangetica, Lissemys punctata, Batagur spp.]
    cites: "I/II"
    products: [live, meat, calipee]
    terms:
      en: [star tortoise, star tortoises, softshell turtle, softshell turtles, flapshell turtle, tortoise, tortoises, turtle, turtles]
      hi_latn: [kachua, kachhua]
      hi: [कछुआ, कछुए]
      vi: [rùa]
      id_ms: [kura-kura, penyu, labi-labi]
  sea_fan:
    label: Sea fan & corals
    taxa: [Gorgonacea, Scleractinia]
    cites: "II"
    products: [dried]
    terms:
      en: [sea fan, sea fans, black coral, corals seized, coral smuggling]
      hi_latn: [indrajal]  # owt
      hi: [इंद्रजाल]
  tokay_gecko:
    label: Tokay gecko
    taxa: [Gekko gecko]
    cites: "II"
    products: [live, dried]
    terms:
      en: [tokay gecko, tokay geckos, tokay]  # owt
      vi: [tắc kè]
      id_ms: [tokek]
  elephant:
    label: Elephant (ivory)
    taxa: [Elephas maximus, Loxodonta africana]
    cites: "I"
    products: [ivory, tusk, "gajmukta (fake pearl)"]
    terms:
      en: [ivory, elephant tusk, elephant tusks, elephant pearl]  # owt
      hi_latn: [gajmukta, gajamukta, hathi dant, haathi daant]  # owt
      hi: [हाथी दांत, गजमुक्ता]
      vi: [ngà voi]
      id_ms: [gading gajah]
      th: [งาช้าง]
  tiger:
    label: Tiger
    taxa: [Panthera tigris]
    cites: "I"
    products: [skin, bones, claws, teeth]
    terms:
      en: [tiger skin, tiger skins, tiger pelt, tiger pelts, tiger bones, tiger claws, tiger teeth, tiger parts, tiger poaching, tiger poacher, tiger poachers]
      hi_latn: [bagh ki khal]
      hi: [बाघ की खाल, बाघ के नाखून]
      vi: [cao hổ, xương hổ]
      id_ms: [kulit harimau]
  leopard:
    label: Leopard
    taxa: [Panthera pardus, Neofelis nebulosa]
    cites: "I"
    products: [skin, claws]
    terms:
      en: [leopard skin, leopard skins, leopard pelt, leopard pelts, leopard claws, leopard hide, leopard hides, clouded leopard, leopard poaching, leopard poachers]
      hi_latn: [tendua khal, tendue ki khal]
      hi: [तेंदुए की खाल]
  rhino:
    label: Rhinoceros
    taxa: [Rhinoceros unicornis, Rhinoceros sondaicus]
    cites: "I"
    products: [horn]
    terms:
      en: [rhino horn, rhino horns, rhinoceros horn, rhino poaching, rhino poachers]
      hi_latn: [gainda seeng]
      hi: [गैंडे का सींग]
      vi: [sừng tê giác]
      id_ms: [cula badak]
  owl:
    label: Owls
    taxa: [Strigiformes]
    cites: "II"
    products: [live, parts]
    terms:
      en: [owl smuggling, owls seized, owl trade, owls rescued, owl seized]
      hi: [उल्लू]
  birds:
    label: Parakeets & songbirds
    taxa: [Psittacula spp., Gracula religiosa]
    cites: "II"
    products: [live]
    terms:
      en: [parakeets, parrots seized, munias, hill myna, birds seized, bird trade, bird trappers]
      hi: [तोते]
  red_sanders:
    label: Red sanders
    taxa: [Pterocarpus santalinus]
    cites: "II"
    products: [logs]
    terms:
      en: [red sanders, red sandalwood, red sandal logs, red sanders logs]
      hi_latn: [lal chandan, rakta chandan]
      hi: [लाल चंदन]
      te: [ఎర్రచందనం]
  shark_ray:
    label: Sharks, rays & sea cucumbers
    taxa: [Selachimorpha, Batoidea, Holothuroidea, Hippocampus spp.]
    cites: "II"
    products: [fins, gill plates, dried]
    terms:
      en: [shark fin, shark fins, manta gill, sea cucumber, sea cucumbers, seahorse, seahorses, sea horses]
      vi: [vây cá mập, hải sâm, cá ngựa]
      id_ms: [sirip hiu, teripang]
  primates:
    label: Primates
    taxa: [Nycticebus spp., Macaca spp., Pongo spp., Hoolock spp.]
    cites: "I/II"
    products: [live]
    terms:
      en: [slow loris, slow lorises, orangutan, orangutans, gibbon, gibbons, langur, langurs]
      id_ms: [kukang]
  hornbill:
    label: Hornbills
    taxa: [Rhinoplax vigil, Bucerotidae]
    cites: "I/II"
    products: [casque, live]
    terms:
      en: [hornbill, hornbills, helmeted hornbill, hornbill casque]
      id_ms: [rangkong, enggang]
  bear:
    label: Bears
    taxa: [Melursus ursinus, Helarctos malayanus, Ursus thibetanus]
    cites: "I"
    products: [bile, gall bladder, paws]
    terms:
      en: [bear bile, bear gall, bear paws, sloth bear, sun bear]
      vi: [mật gấu]
  mongoose:
    label: Mongoose (hair brushes)
    taxa: [Urva spp.]
    cites: "III"
    products: [hair, brushes]
    terms:
      en: [mongoose hair, mongoose brushes, mongoose hair brushes]
      hi: [नेवला]

# Words that signal a trade listing (supply side) rather than a news report.
sale_cues:
  en: [for sale, price, buy, sell, seller, whatsapp, call, contact, genuine, real test, tester, available, wholesale]
  hi_latn: [ki kimat, ki kimmat, kimat, ke fayde, ke labh, asli, original test, milega, uplabdh]
  hi: [कीमत, बिक्री, असली, फायदे, संपर्क]

# Words that signal an enforcement event (the news side).
enforcement_cues:
  seizure: [seized, seizure, seize, seizes, recovered, confiscated, intercepted, haul, bust, busted, smuggling, smuggled, जब्त, bắt giữ, disita]
  arrest: [arrested, arrest, arrests, held, nabbed, detained, apprehended, गिरफ्तार, ditangkap, ditahan]
  conviction: [convicted, sentenced, jailed, imprisonment, rigorous imprisonment, सजा, dihukum]
  rescue: [rescued, released into the wild, rehabilitated]
  bail: [bail granted, granted bail, acquitted, discharged]

agencies:
  IN: [WCCB, Wildlife Crime Control Bureau, DRI, Directorate of Revenue Intelligence, Customs, Forest Department, forest officials, forest officers, forest department, STF, Special Task Force, CBI, police, Crime Branch, Coast Guard, SSB, Sashastra Seema Bal, BSF, Border Security Force, RPF, Railway Protection Force, CISF, Assam Rifles, ITBP]
  SEA: [Environmental Police, Customs Department, PERHILITAN, Department of National Parks, KLHK, Gakkum, BKSDA, Bureau of Customs, DENR, ASEAN-WEN]
  INTL: [INTERPOL, UNODC, CITES Secretariat, TRAFFIC, Wildlife Justice Commission, WCS, Freeland, EIA]

modes:
  air: [airport, flight, air cargo, checked-in baggage, passenger baggage, air intelligence unit]
  sea: [seaport, container, vessel, fishing boat, trawler, ship]
  rail: [train, railway station, railway, express train]
  road: [truck, lorry, highway, checkpost, check post, naka, vehicle, car, bus, motorcycle]
  post: [courier, parcel, postal, speed post]
  online: [facebook, instagram, whatsapp, telegram, youtube, online, e-commerce, social media]
