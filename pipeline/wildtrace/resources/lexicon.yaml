      pt: [pangolim, escamas de pangolim]
      es: [pangolín, escamas de pangolín]
      fr: [écailles de pangolin, pangolins saisis]
      hi_latn: [vajrakit, bajarkit, bajrakapta, bajra kapta, vajrakit chilka, pangolin chilka]  # owt
      hi: [पैंगोलिन, वज्रकीट]
      te_latn: [alugu, alugu chippalu, adavi volgo]  # owt
      te: [అలుగు]
      vi: [tê tê, vảy tê tê]
