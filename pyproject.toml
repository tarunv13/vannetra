[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wildtrace"
version = "0.1.0"
description = "WildTrace: open-source intelligence map and link-analysis workbench for the global illegal wildlife trade"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "requests>=2.31",
  "pyyaml>=6.0",
  "networkx>=3.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
web = ["trafilatura>=1.8"]
video = ["yt-dlp>=2024.1"]
dev = ["pytest>=8"]

[project.scripts]
wildtrace = "wildtrace.cli:main"

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.setuptools.package-data]
wildtrace = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]
