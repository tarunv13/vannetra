# Weekly: collect open news, rebuild cases and graph, deploy the static site to GitHub Pages.
# The private WCS-OWT data and trained model are NOT in the repo, so CI keeps the
# last published model report and trade-signal aggregates (see publish.py).
name: update-and-deploy
on:
  schedule: [{ cron: "30 2 * * 1" }]
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e .
      - name: Restore collected records (rolling archive, never committed)
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      # YouTube is left out of CI: datacentre IPs are routinely bot-checked. Run it locally.
      - run: python -m vannetra.cli run --timespan 1m --gnews --countries ALL
      - run: pytest -q || true
      - name: Commit refreshed public data
        run: |
          git config user.name "vannetra-bot"; git config user.email "actions@users.noreply.github.com"
          git add web/data && git commit -m "data: weekly refresh" || echo "no changes"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
